<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заманбап Такси</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      background: #f2f5f8;
    }
    h1 { color: #087f5b; text-align: center; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #087f5b;
      color: white;
      border: 0;
      cursor: pointer;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>🚕 Заманбап Такси</h1>
  <h3>Айдоочу бөлүмү</h3>

  <form id="loginForm">
    <input id="email" type="email" placeholder="Электрондук почта" required>
    <input id="password" type="password" placeholder="Сырсөз" required>
    <button type="submit">Кирүү</button>
  </form>

  <p id="message">Айдоочу аккаунтуңуз менен кириңиз.</p>

  <section id="profile" hidden>
    <h3>Айдоочу профили</h3>
    <p id="driverInfo"></p>
    <button id="logout" type="button">Чыгуу</button>
  </section>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://kcbjdznshvfzirnkubzc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FxVrXVkuxgNemRymmMo1-A_aRU7La7Y';

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');
    const profile = document.getElementById('profile');

    function showForm() {
      form.hidden = false;
      profile.hidden = true;
    }

    function hideForm() {
      form.hidden = true;
      profile.hidden = false;
    }

    async function showDriver(user) {
      try {
        const { data, error } = await supabase
          .from('users')
          .select('id, full_name, phone, role')
          .eq('id', user.id)
          .maybeSingle();

        if (error) {
          console.error('Driver query error:', error);
          message.textContent = 'Маалымат алуу катасы: ' + error.message;
          return;
        }

        if (!data) {
          message.textContent = 'Айдоочунун профили табылган жок.';
          return;
        }

        const role = String(data.role || '').toLowerCase();

        if (role !== 'driver') {
          message.textContent = 'Бул аккаунт айдоочу эмес.';
          return;
        }

        hideForm();
        document.getElementById('driverInfo').textContent =
          'Аты: ' + (data.full_name || 'Толтурула элек') +
          ' | Телефон: ' + (data.phone || 'Толтурула элек') +
          ' | Ролу: ' + data.role;

        message.textContent = 'Ийгиликтүү кирдиңиз!';
      } catch (e) {
        console.error('Unexpected error:', e);
        message.textContent = 'Күтүлбөгөн катасы: ' + e.message;
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = 'Текшерилүүдө...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          console.error('Login error:', error);
          message.textContent = 'Кирүү катасы: ' + error.message;
          return;
        }

        if (data?.user) {
          await showDriver(data.user);
        } else {
          message.textContent = 'Аккаунт табылган жок.';
        }
      } catch (e) {
        console.error('Submit error:', e);
        message.textContent = 'Кирүү учурунда кате: ' + e.message;
      }
    });

    document.getElementById('logout').addEventListener('click', async () => {
      try {
        const { error } = await supabase.auth.signOut();

        if (error) {
          console.error('Logout error:', error);
          message.textContent = 'Чыгуу катасы: ' + error.message;
          return;
        }

        showForm();
        form.reset();
        message.textContent = 'Системадан чыктыңыз.';
      } catch (e) {
        console.error('Logout exception:', e);
        message.textContent = 'Чыгуу учурунда кате: ' + e.message;
      }
    });

    async function checkSession() {
      const { data: { session }, error } = await supabase.auth.getSession();

      if (error) {
        console.error('Session error:', error);
        message.textContent = 'Сессия текшерүү катасы: ' + error.message;
        return;
      }

      if (session?.user) {
        await showDriver(session.user);
      } else {
        showForm();
      }
    }

    checkSession();
  </script>
</body>
</html>
