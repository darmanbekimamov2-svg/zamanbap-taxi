
<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заманбап Такси — Айдоочу</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;padding:20px}
.container{max-width:650px;margin:30px auto;background:white;padding:22px;border-radius:15px}
h2{text-align:center;color:#1677cc}
input,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box;border-radius:8px}
input{border:1px solid #ccc}
button{background:#1677cc;color:white;border:0;font-weight:bold;cursor:pointer}
.order{border:1px solid #ddd;padding:15px;margin:12px 0;border-radius:10px}
.hidden{display:none}
#message{color:#d33;text-align:center}
</style>
</head>
<body>
<div class="container">
<h2>🚕 Заманбап Такси</h2>
<h3>Айдоочунун бөлүмү</h3>

<div id="login">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Сырсөз">
<button onclick="login()">Кирүү</button>
</div>
<div id="stats" style="display:none;">
  <h3>📊 Менин көрсөткүчтөрүм</h3>

  <p>Бүгүнкү киреше:
    <b id="dailyIncome">0 сом</b>
  </p>

  <p>Аткарылган буйрутмалар:
    <b id="completedCount">0</b>
  </p>

  <h3>📋 Буйрутмалар тарыхы</h3>
  <div id="history"></div>
</div>
<div id="dashboard" class="hidden">
<p id="driver"></p>
<p id="gpsStatus">GPS текшерилүүдө...</p>
<button onclick="loadOrders()">Буйрутмаларды жаңылоо</button>
<div id="orders"></div>
<button onclick="logout()">Чыгуу</button>
</div>

<p id="message"></p>
</div>

<script>
const SUPABASE_URL = "https://kcbjdznshvfzirnkubzc.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_FxVrXVkuxgNemRymmMo1-A_aRU7La7Y";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const message = document.getElementById("message");

async function login(){
  message.textContent = "Кирүү текшерилүүдө...";
  const {data,error} = await db.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value
  });
  if(error){message.textContent=error.message;return;}
  showDashboard(data.user);
  console.log("DASHBOARD АЧЫЛДЫ");
}
let gpsWatchId = null;

function startGpsTracking(user) {
  if (!navigator.geolocation) {
    document.getElementById("gpsStatus").textContent = "GPS жеткиликсиз";
    return;
  }

 document.getElementById("gpsStatus").textContent = "GPS уруксаты суралууда...";
console.log("GPS ФУНКЦИЯСЫ ИШТЕДИ");
  gpsWatchId = navigator.geolocation.watchPosition(
    async (position) => {
      const { latitude, longitude } = position.coords;

      const { error } = await db
        .from("driver_locations")
        .upsert({
          user_id: user.id,
          latitude,
          longitude,
         

updated_at: new Date().toISOString()
        }, { onConflict: "user_id" });
if (error) {
  console.log("GPS ТОЛУК КАТАСЫ:", error);
  document.getElementById("gpsStatus").textContent =
    "GPS катасы: " + error.message;
} else {
  document.getElementById("gpsStatus").textContent = "GPS иштеп жатат";
}
      } else {
       document.getElementById("gpsStatus").textContent = "GPS иштеп жатат";
      }
    },
    (error) => {
      document.getElementById("gpsStatus").textContent = "GPS катасы: " + error.message;
    },
    {
      enableHighAccuracy: true,
      maximumAge: 10000,
      timeout: 15000
    }
  );
}
async function showDashboard(user){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  document.getElementById("stats").style.display = "block";
  document.getElementById("driver").textContent="Айдоочу: "+user.email;

  let gpsStatus = document.getElementById("gpsStatus");

  if (!gpsStatus) {
    gpsStatus = document.createElement("p");
    gpsStatus.id = "gpsStatus";
    document.getElementById("driver").after(gpsStatus);
  }

  gpsStatus.textContent = "GPS башталууда...";

startGpsTracking(user);
await loadOrders();
await loadDriverStats(user);
await loadDriverHistory(user);

if (window.statsTimer) {
  clearInterval(window.statsTimer);
}

window.statsTimer = setInterval(async () => {
  await loadDriverStats(user);
}, 5000);

}

async function loadDriverStats(user){
  const today = new Date();
  today.setHours(0,0,0,0);

  const {data,error} = await db.from("orders")
   .select("fare,status,completed_at")
    .eq("driver_id",user.id)
    .eq("status","completed")
    .gte("completed_at",today.toISOString());

  if(error){
    message.textContent=error.message;
    return;
  }

  const income = data.reduce(
    (sum,order)=>sum+Number(order.fare || 0),0
  );

  document.getElementById("dailyIncome").textContent =
    income.toFixed(2)+" сом";

  document.getElementById("completedCount").textContent =
    data.length;
}

async function loadDriverHistory(user){
  const {data,error} = await db.from("orders")
    .select("id,customer_name,pickup_address,destination_address,fare,created_at")
    .eq("driver_id",user.id)
    .eq("status","completed")
    .order("created_at",{ascending:false});

  const history = document.getElementById("history");
  history.innerHTML = "";

  if(error){
    history.textContent = error.message;
    return;
  }

  if(!data.length){
    history.textContent = "Азырынча аткарылган буйрутма жок";
    return;
  }

  data.forEach(order=>{
    const div = document.createElement("div");
    div.className = "order";

    const info = document.createElement("p");
    info.textContent =
      "№"+order.id+
      "\nКардар: "+order.customer_name+
      "\nКайдан: "+order.pickup_address+
      "\nКайда: "+order.destination_address+
      "\nБаасы: "+(order.fare ?? "Белгисиз")+" сом";

    div.appendChild(info);
    history.appendChild(div);
  });
}

async function loadOrders(){
  const { data: { user } } = await db.auth.getUser();

  if(!user){
    message.textContent = "Аккаунтка кайра кириңиз";
    return;
  }

  const {data,error}=await db.from("orders")
    .select("*")
    .or(`and(status.eq.pending,driver_id.is.null),driver_id.eq.${user.id}`)
    .order("created_at",{ascending:false});

  if(error){
    message.textContent=error.message;
    return;
  }

  const area=document.getElementById("orders");
  area.innerHTML="";

  if(!data.length){
    area.textContent="Азырынча буйрутма жок";
    return;
  }

  data.forEach(order=>{
    const div=document.createElement("div");
    div.className="order";

    const info=document.createElement("p");
    info.textContent=
      "Буйрутма №"+order.id+
      "\nКардар: "+order.customer_name+
      "\nТелефон: "+order.customer_phone+
      "\nКайдан: "+order.pickup_address+
      "\nКайда: "+order.destination_address+
      "\nТөлөм: "+order.payment_method+
      "\nБаасы: "+(order.fare ?? "Белгисиз")+
      "\nАбалы: "+order.status;

    div.appendChild(info);

    if(order.driver_id === user.id){
      const label=document.createElement("p");
      label.textContent="Диспетчер бул буйрутманы сизге бекитти";
      div.appendChild(label);
      const nextSteps = {
  accepted: ["Жолго чыктым", "on_the_way"],
  on_the_way: ["Кардарга жеттим", "arrived"],
  arrived: ["Аткарылды", "completed"]
};

const next = nextSteps[order.status];

if(next){
  const btn = document.createElement("button");
  btn.textContent = next[0];
  btn.onclick = () =>
    updateOrderStatus(order.id, next[1], btn);
  div.appendChild(btn);
}

    }else{
      const btn=document.createElement("button");
      btn.textContent="Буйрутманы кабыл алуу";
      btn.onclick=()=>acceptOrder(order.id,btn);
      div.appendChild(btn);
    }

    area.appendChild(div);
  });
}

  



async function acceptOrder(id,btn){
  btn.disabled=true;
  const {data,error}=await db.rpc("accept_order",{order_id:id});
  if(error){
    message.textContent=error.message;
    btn.disabled=false;
    return;
  }
  if(data===true){
    message.textContent="Буйрутма кабыл алынды!";

    const {data: {user}} = await db.auth.getUser();

    const {error: statusError} = await db
      .from("driver_locations")
      .update({
        status: "accepted",
        is_available: false,
        updated_at: new Date().toISOString()
      })
      .eq("user_id", user.id);

    if(statusError){
      message.textContent += " Статус катасы: " + statusError.message;
    }
  }else{
    message.textContent="Бул буйрутманы башка айдоочу кабыл алган болушу мүмкүн.";
  }
  await loadOrders();
}


async function updateOrderStatus(id, status, btn){
  btn.disabled = true;

  const {data: {user}} = await db.auth.getUser();

  if(!user){
    message.textContent = "Аккаунтка кайра кириңиз";
    btn.disabled = false;
    return;
  }

  const {error} = await db.from("orders")
   .update(
  status === "completed"
    ? {
        status: status,
        completed_at: new Date().toISOString()
      }
    : {
        status: status
      }
)
    .eq("id", id)
    .eq("driver_id", user.id);

  if(error){
    message.textContent = error.message;
    btn.disabled = false;
    return;
  }

  const isCompleted = status === "completed";

  const {error: locationError} = await db
    .from("driver_locations")
    .update({
      status: isCompleted ? "available" : status,
      is_available: isCompleted,
      updated_at: new Date().toISOString()
    })
    .eq("user_id", user.id);

  if(locationError){
    message.textContent =
      "Буйрутма жаңырды, бирок карта статусунда ката: " +
      locationError.message;
    btn.disabled = false;
    return;
  }

  message.textContent = "Буйрутманын абалы өзгөрдү!";
  await loadOrders();
  await loadDriverStats(user);
  await loadDriverHistory(user);
}

async function logout(){
  await db.auth.signOut();
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
}

async function init(){
  const {data}=await db.auth.getSession();
  if(data.session) await showDashboard(data.session.user);
}
init();
</script>
</body>
</html>
