
<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заманбап Такси — Диспетчер</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f2f4f7;padding:20px}
.container{max-width:800px;margin:auto;background:white;padding:20px;border-radius:12px}
input,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box}
button{background:#1677e8;color:white;border:0;border-radius:6px}
.hidden{display:none}
.order{padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px}
</style>
 <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script> 
</head>
<body>
<div class="container">
<h2>Заманбап Такси — Диспетчер</h2>

<div id="login">
<input id="email" type="email" placeholder="Электрондук почта">
<input id="password" type="password" placeholder="Сырсөз">
<button onclick="login()">Кирүү</button>
<p id="message"></p>
</div>

<div id="dashboard" class="hidden">
<p id="dispatcher"></p>
<button onclick="loadOrders()">Буйрутмаларды жаңылоо</button>
<div id="orders"></div>
  <h3>Айдоочулардын картасы</h3>
<div id="map" style="height:450px;width:100%;border-radius:10px;"></div>
<button onclick="logout()">Чыгуу</button>
</div>
</div>

<script>
const SUPABASE_URL="https://kcbjdznshvfzirnkubzc.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_FxVrXVkuxgNemRymmMo1-A_aRU7La7Y";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const message=document.getElementById("message");

async function login(){
message.textContent="Кирүү текшерилүүдө...";
const {data,error}=await db.auth.signInWithPassword({
email:document.getElementById("email").value.trim(),
password:document.getElementById("password").value
});
if(error){message.textContent=error.message;return;}
await showDashboard(data.user);

}

async function showDashboard(user){
const {data:role,error}=await db.from("user_roles")
.select("role").eq("user_id",user.id).single();

if(error || role.role!=="dispatcher"){
message.textContent="Бул аккаунт диспетчер эмес.";
await db.auth.signOut();
return;
}

document.getElementById("login").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");
document.getElementById("dispatcher").textContent="Диспетчер: "+user.email;
await loadOrders();
 if (window.orderTimer) {
  clearInterval(window.orderTimer);
}

window.orderTimer = setInterval(async () => {
  console.log("Буйрутмалар автоматтык жаңыланууда...");
  await loadOrders();
}, 5000);
initMap();
await loadDriverLocations();
setInterval(loadDriverLocations, 10000);
}
let map;
let driverMarkers = {};

function initMap(){
  if(map) return;

  map = L.map("map").setView([40.1, 71.7], 11);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap"
  }).addTo(map);
}


async function loadDriverLocations(){
  if(!map) initMap();

  const {data,error} = await db
    .from("driver_locations")
    .select("*");

  if(error){
    message.textContent = "GPS катасы: " + error.message;
    return;
  }

  const {data: drivers, error: driversError} = await db
    .from("user_roles")
    .select("user_id, full_name")
    .eq("role","driver");

  if(driversError){
    message.textContent = "Айдоочу катасы: " + driversError.message;
    return;
  }

  const statusNames = {
    available: "🟢 Бош айдоочу",
    accepted: "🟠 Буйрутма кабыл алды",
    on_the_way: "🔵 Жолго чыкты",
    arrived: "🟣 Кардарга жетти"
  };

  data.forEach(driver=>{
    const driverInfo = drivers?.find(
      item => item.user_id === driver.user_id
    );

    const driverName = driverInfo?.full_name || "Аты белгисиз";

    const position = [
      driver.latitude,
      driver.longitude
    ];

    const driverStatus =
      statusNames[driver.status] ||
      (driver.is_available ? "🟢 Бош айдоочу" : "Буйрутмада");

    const popupText =
      "Айдоочу: " + driverName +
      "<br>Абалы: " + driverStatus +
      "<br>Кеңдик: " + driver.latitude +
      "<br>Узундук: " + driver.longitude +
      "<br>Жаңыртылды: " +
      new Date(driver.updated_at).toLocaleTimeString();

    if(driverMarkers[driver.user_id]){
      driverMarkers[driver.user_id].setLatLng(position);
      driverMarkers[driver.user_id].setPopupContent(popupText);
    }else{
      driverMarkers[driver.user_id] =
        L.marker(position)
          .addTo(map)
          .bindPopup(popupText);
    }
  });
}
 setInterval(() => {
  loadDriverLocations();
}, 5000);


async function loadOrders(){
  const {data,error}=await db.from("orders")
    .select("*").order("created_at",{ascending:false});

  if(error){
    message.textContent=error.message;
    return;
  }

  const {data:drivers,error:driversError}=await db
    .from("user_roles")
    .select("user_id,full_name")
    .eq("role","driver");

  if(driversError){
    message.textContent=driversError.message;
    return;
  }

  const area=document.getElementById("orders");
  area.innerHTML="";

  const groups={
    pending:"🟡 Жаңы буйрутмалар",
    accepted:"🟠 Кабыл алынган",
    on_the_way:"🔵 Жолдо",
    arrived:"🟣 Кардарга жеткен",
    completed:"🟢 Аткарылган"
  };

  Object.keys(groups).forEach(status=>{
    const heading=document.createElement("h3");
    heading.textContent=groups[status];
    area.appendChild(heading);

    const statusOrders=data.filter(
      order=>order.status===status
    );

    if(statusOrders.length===0){
      const empty=document.createElement("p");
      empty.textContent="Буйрутма жок";
      area.appendChild(empty);
    }

    statusOrders.forEach(order=>{
      let driverOptions='<option value="">Айдоочу тандаңыз</option>';

      drivers.forEach(driver=>{
        driverOptions+=`<option value="${driver.user_id}">${driver.full_name}</option>`;
      });

      const div=document.createElement("div");
      div.className="order";

      div.innerHTML=
        "<b>Буйрутма №"+order.id+"</b><br>"+
        "Кардар: "+order.customer_name+"<br>"+
        "Телефон: "+order.customer_phone+"<br>"+
        "Кайдан: "+order.pickup_address+"<br>"+
        "Кайда: "+order.destination_address+"<br>"+
        "Абалы: "+order.status+"<br>"+
        "<select id='driver-"+order.id+"'>"+
        driverOptions+"</select>"+
        "<button onclick='assignDriver("+order.id+")'>Айдоочуга бекитүү</button>";

      area.appendChild(div);
    });
  });
}


async function assignDriver(orderId){
  const driverId = document.getElementById("driver-" + orderId).value;

  if(!driverId){
    alert("Айдоочуну тандаңыз!");
    return;
  }

  const { data, error } = await db.rpc("assign_order", {
    order_id: orderId,
    assigned_driver_id: driverId
  });

  if(error){
    alert("Ката: " + error.message);
    return;
  }

  if(!data){
    alert("Буйрутма табылган жок же мурда бекитилген!");
    return;
  }

  alert("Буйрутма айдоочуга ийгиликтүү бекитилди!");
  await loadOrders();
 if (window.orderTimer) {
  clearInterval(window.orderTimer);
}

window.orderTimer = setInterval(async () => {
  await loadOrders();
}, 5000);
}

async function logout(){
await db.auth.signOut();
location.reload();
}

async function init(){
const {data}=await db.auth.getSession();
if(data.session) await showDashboard(data.session.user);
}
init();
</script>
</body>
</html>
